name: kitaura_admin
description: "KitAura Admin Panel — Flutter Web (separate deployment from main app)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3

  # Charts (Cost Overview / KPI sparklines)
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.20.0

  # Web interop (for openInNewTab, copy to clipboard via package:web)
  web: ^1.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Fonts (same as main app — copy these from main project's assets/fonts/)
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins.ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans.ttf